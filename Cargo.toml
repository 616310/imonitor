[package]
name = "imonitor"
version = "0.2.0"
edition = "2021"
description = "Self-hosted server monitoring panel with a Rust backend, Vue dashboard, and lightweight agent."
license = "MIT"
repository = "https://github.com/616310/imonitor"
readme = "README.md"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "fs", "signal", "net"] }
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
libc = "0.2"
mime_guess = "2.0"
